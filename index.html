<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단말 스캔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#E7E4DD;--card:#FBFAF7;--ink:#17181A;--ink-2:#5C5F63;--rule:#C8C4BA;
    --stamp:#0F6B3F;--alarm:#B3261E;--wait:#8A6A12;--steel:#1F2937;--r:3px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink)}
  body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:0 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px 30px}
  header{padding:10px 0 7px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .state{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2)}
  .state.bad{color:var(--alarm)}
  .stage{position:relative;background:#000;border:2px solid var(--steel);border-radius:var(--r);
    overflow:hidden;aspect-ratio:16/9;cursor:pointer}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .hit{position:absolute;inset:0;border:6px solid #3ED27B;opacity:0;pointer-events:none}
  .hit.on{opacity:1;transition:opacity .5s}
  .live{position:absolute;left:9px;top:8px;display:flex;align-items:center;gap:6px;color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-shadow:0 1px 3px #000;pointer-events:none}
  .live i{width:7px;height:7px;border-radius:50%;background:#FF3B30;animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .idle{position:absolute;inset:0;display:grid;place-items:center;color:#8b8f94;font-size:13px;
    padding:16px;text-align:center;white-space:pre-line}
  .tip{margin-top:6px;font-size:12px;color:var(--ink-2);text-align:center}
  .btns{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:9px}
  button{font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;border:2px solid var(--steel);
    border-radius:var(--r);background:var(--card);color:var(--ink);cursor:pointer;font-size:15px;padding:13px 8px}
  #btnFocus{background:var(--steel);color:#fff}
  button:active{background:var(--steel);color:#fff}
  button:disabled{opacity:.4}

  /* ── 큰 결과판 ── */
  .board{margin-top:12px;border:2px solid var(--rule);border-radius:var(--r);
    background:var(--card);padding:16px 16px 14px}
  .board.on{border-color:var(--stamp);background:#EAF4EE}
  .board .cap{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
  .board .none{color:var(--ink-2);font-size:15px;padding:6px 0 4px}
  .fld{display:flex;align-items:baseline;gap:12px;padding:5px 0}
  .fld dt{font-size:12.5px;color:var(--ink-2);width:44px;flex:none}
  .fld dd{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:-.01em;
    word-break:break-all;line-height:1.25}
  .f-model dd{font-size:25px}
  .f-color dd{font-size:20px}
  .f-serial dd{font-size:31px;color:var(--stamp)}
  .board.on .f-serial dd{color:#0A4D2D}
  .code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-2);font-weight:400}
  .raw{margin-top:11px;padding-top:9px;border-top:1px dotted var(--rule);
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-2);word-break:break-all}
  .miss{color:var(--alarm)}
  .askcolor{margin-top:9px;display:flex;gap:6px}
  .askcolor input{flex:1;font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;padding:9px 10px;
    border:2px solid var(--wait);border-radius:var(--r);background:#fff;min-width:0}
  .askcolor button{width:auto;padding:9px 14px;font-size:14px;border-color:var(--wait);
    background:var(--wait);color:#fff}

  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
    font-family:'IBM Plex Mono',monospace;margin:18px 0 6px;padding-bottom:5px;
    border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
  ol{list-style:none}
  ol li{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--stamp);
    border-radius:var(--r);margin-bottom:6px;padding:9px 12px;display:flex;justify-content:space-between;
    align-items:baseline;gap:10px}
  ol li .v{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600}
  ol li .m{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2);text-align:right}
  .empty{border:1px dashed var(--rule);border-radius:var(--r);padding:16px;text-align:center;
    color:var(--ink-2);font-size:13px}
  details{margin-top:16px}
  summary{font-size:12px;color:var(--ink-2);cursor:pointer;padding:4px 0}
  .log{background:var(--steel);color:#D6D3CB;border-radius:var(--r);padding:9px 11px;margin-top:6px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;max-height:130px;
    overflow:auto;white-space:pre-wrap;word-break:break-all}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>단말 스캔</h1>
  <span class="state" id="state">준비 중…</span>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div class="hit" id="hit"></div>
  <div class="live" id="liveTag" hidden><i></i>읽는 중</div>
  <div class="idle" id="idle">카메라 켜는 중…</div>
</div>
<div class="tip">바코드가 화면 가로를 가득 채우게 · 흐리면 화면을 톡 누르세요</div>

<div class="btns">
  <button id="btnFocus" disabled>초점 다시 잡기</button>
  <button id="btnReset">지우기</button>
</div>

<div class="board" id="board">
  <div class="cap">마지막 인식</div>
  <div class="none">바코드를 비추세요</div>
</div>

<h2><span>스캔 목록</span><span id="tot">0</span></h2>
<ol id="list"><li style="border-left-color:var(--rule);justify-content:center;color:var(--ink-2);font-size:13px">아직 없습니다</li></ol>

<details>
  <summary>색상표 · 기록 (문제 있을 때만)</summary>
  <button id="btnColors" style="margin-top:8px;font-size:14px;padding:11px 8px">색상표 복사</button>
  <div class="log" id="log">대기 중…</div>
  <button id="btnCopy" style="margin-top:8px;font-size:14px;padding:11px 8px">기록 복사</button>
</details>

</div>

<script>
(function(){
  'use strict';

  /* ═══ 모델키 → 모델명 (매미 재고 데이터에서 추출한 21종) ═══ */
  const MODEL={
    A166:'SM-A166L', A175:'SM-A175N', A176:'SM-A176L', A276:'SM-A276K',
    A356:'SM-A356N', A566:'SM-A566S', F761:'SM-F761N', F766:'SM-F766N',
    L325:'SM-L325N', M166:'SM-M166S', M176:'SM-M176S', M366:'SM-M366N',
    S731:'SM-S731N', S931:'SM-S931N', S936:'SM-S936N', S937:'SM-S937N',
    S938:'SM-S938N', S942:'SM-S942N', S947:'SM-S947N', S948:'SM-S948N',
    X236:'SM-X236N'
  };
  /* ═══ 모델키+색상코드 → 색상명 (현장에서 채워짐) ═══ */
  const COLOR={
    'A175A':'그레이', 'A175B':'라이트블루', 'S942K':'블랙'
  };
  /* ════════════════════════════════════════════ */

  const $=id=>document.getElementById(id);
  const video=$('video'),idle=$('idle'),hit=$('hit'),listEl=$('list'),logEl=$('log'),board=$('board');
  const S={stream:null,track:null,bd:null,zx:null,rdr:null,live:false,busy:false,tick:0,
           sn:new Map(),newColors:{},cur:null};

  const lines=[];
  function log(m){
    const t=new Date().toTimeString().slice(0,8);
    lines.push(t+'  '+m);logEl.textContent=lines.slice(-140).join('\n');
    logEl.scrollTop=logEl.scrollHeight;
  }
  function setState(t,bad){const e=$('state');e.textContent=t;e.className='state'+(bad?' bad':'');}
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  let actx=null;
  function beep(){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();
      const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
      o.type='square';o.frequency.setValueAtTime(2400,t);
      g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.11);
    }catch(_){}
    hit.classList.add('on');setTimeout(()=>hit.classList.remove('on'),320);
  }

  /* Code128 · Code39 만 통과. QR·매트릭스·EAN·IMEI 는 버림 */
  function isLinear(fmt){
    const f=String(fmt).toLowerCase();
    return f.indexOf('code_128')>=0||f.indexOf('code128')>=0||f==='4'||
           f.indexOf('code_39')>=0 ||f.indexOf('code39')>=0 ||f==='3';
  }
  function parse(v){
    const u=String(v).toUpperCase();
    if(/^SM[A-Z0-9]{13}$/.test(u)){
      const key=u.slice(2,6), cc=u[7];
      return {raw:u, samsung:true, key:key,
              model:MODEL[key]||null,
              cc:cc, color:COLOR[key+cc]||null,
              serial:u.slice(8)};
    }
    return {raw:u, samsung:false, key:null, model:null, cc:null, color:null, serial:u.slice(-7)};
  }

  function add(raw,fmt,eng){
    const v=String(raw||'').trim().toUpperCase();
    if(!v)return;
    if(!isLinear(fmt)){ log('무시 [형식 '+fmt+'] '+v.slice(0,28)); return; }
    if(/^\d{15}$/.test(v)){ log('무시 [IMEI] '+v); return; }
    if(S.sn.has(v))return;
    const p=parse(v);
    S.sn.set(v,p);
    log('★ '+v+'  ['+eng+']');
    S.cur=p; paintBoard(); paintList(); beep();
  }

  function paintBoard(){
    const p=S.cur;
    if(!p){ board.className='board';
      board.innerHTML='<div class="cap">마지막 인식</div><div class="none">바코드를 비추세요</div>';
      return; }
    board.className='board on';
    let h='<div class="cap">마지막 인식</div>';
    if(p.samsung){
      const model = p.model
        ? esc(p.model)+' <span class="code">('+esc(p.key)+')</span>'
        : '<span class="miss">미등록</span> <span class="code">('+esc(p.key)+')</span>';
      const color = p.color
        ? esc(p.color)+' <span class="code">('+esc(p.cc)+')</span>'
        : '<span class="miss">미등록</span> <span class="code">(코드 '+esc(p.cc)+')</span>';
      h+='<dl>'+
         '<div class="fld f-model"><dt>기종</dt><dd>'+model+'</dd></div>'+
         '<div class="fld f-color"><dt>색상</dt><dd>'+color+'</dd></div>'+
         '<div class="fld f-serial"><dt>일련</dt><dd>'+esc(p.serial)+'</dd></div></dl>';
      if(!p.color){
        h+='<div class="askcolor"><input id="cin" placeholder="색상명을 적어 등록 (예: 그레이)" '+
           'autocomplete="off"><button id="cok">등록</button></div>';
      }
    }else{
      h+='<dl><div class="fld f-model"><dt>기종</dt><dd><span class="miss">삼성 형식 아님</span></dd></div>'+
         '<div class="fld f-serial"><dt>값</dt><dd>'+esc(p.raw)+'</dd></div></dl>';
    }
    h+='<div class="raw">'+esc(p.raw)+'</div>';
    board.innerHTML=h;
    const cok=$('cok');
    if(cok) cok.onclick=()=>{
      const nm=($('cin').value||'').trim();
      if(!nm)return;
      COLOR[p.key+p.cc]=nm; S.newColors[p.key+p.cc]=nm;
      log('색상 등록 '+p.key+'+'+p.cc+' = '+nm);
      S.sn.forEach(x=>{ if(x.samsung&&x.key===p.key&&x.cc===p.cc) x.color=nm; });
      paintBoard(); paintList();
    };
  }

  function paintList(){
    const a=[...S.sn.values()].reverse();
    $('tot').textContent=a.length;
    listEl.innerHTML=a.length?a.map(p=>{
      const right = p.samsung
        ? esc((p.model||p.key)+' · '+(p.color||('코드 '+p.cc)))
        : '삼성 형식 아님';
      return '<li><span class="v">'+esc(p.samsung?p.serial:p.raw)+'</span>'+
             '<span class="m">'+right+'</span></li>';
    }).join('')
      :'<li style="border-left-color:var(--rule);justify-content:center;color:var(--ink-2);font-size:13px">아직 없습니다</li>';
  }

  function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
  function crop(src,sx,sy,sw,sh,scale){
    const c=cv(Math.round(sw*scale),Math.round(sh*scale)),x=c.getContext('2d',{willReadFrequently:true});
    x.imageSmoothingQuality='high';x.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);return c;
  }
  function boost(c){
    const x=c.getContext('2d',{willReadFrequently:true}),d=x.getImageData(0,0,c.width,c.height),p=d.data;
    let mn=255,mx=0;
    for(let i=0;i<p.length;i+=32){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      if(g<mn)mn=g;if(g>mx)mx=g;}
    const rg=Math.max(1,mx-mn);
    for(let i=0;i<p.length;i+=4){
      let g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      g=Math.max(0,Math.min(255,(g-mn)*255/rg));p[i]=p[i+1]=p[i+2]=g;}
    x.putImageData(d,0,0);return c;
  }

  function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');
    s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s);});}
  async function loadZX(){
    for(const u of ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
                    'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',
                    'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js']){
      try{await loadScript(u);if(window.ZXing)return true;}catch(e){}}
    return false;
  }
  function initZX(){
    try{
      const Z=window.ZXing,h=new Map();
      h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39]);
      h.set(Z.DecodeHintType.TRY_HARDER,true);
      const r=new Z.MultiFormatReader();r.setHints(h);
      S.rdr=r;S.zx=Z;log('ZXing 준비됨');return true;
    }catch(e){log('ZXing 초기화 실패');return false;}
  }
  function zx(c){
    if(!S.rdr)return null;
    try{
      const Z=S.zx;
      const b=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));
      const r=S.rdr.decode(b);
      return r?{text:r.getText(),fmt:String(r.getBarcodeFormat())}:null;
    }catch(e){return null;}
    finally{try{S.rdr.reset();}catch(_){}}
  }

  async function loop(){
    if(!S.live)return;
    if(!S.busy&&video.readyState>=2&&video.videoWidth){
      S.busy=true;
      try{
        const vw=video.videoWidth,vh=video.videoHeight;
        const m=S.tick%4;S.tick++;
        let c;
        if(m===0)c=crop(video,0,0,vw,vh,1);
        else if(m===1)c=boost(crop(video,0,0,vw,vh,1));
        else if(m===2)c=crop(video,0,Math.round(vh*0.20),vw,Math.round(vh*0.60),1);
        else c=boost(crop(video,0,Math.round(vh*0.20),vw,Math.round(vh*0.60),1));
        if(S.bd){
          try{const f=await S.bd.detect(c);
            for(const b of f) add(b.rawValue,b.format,'크롬');}catch(e){}
        }
        const z=zx(c);
        if(z) add(z.text,z.fmt,'ZXing');
      }catch(e){}
      S.busy=false;
    }
    setTimeout(()=>requestAnimationFrame(loop),50);
  }

  async function refocus(){
    if(!S.track)return;
    try{
      await S.track.applyConstraints({advanced:[{focusMode:'manual'}]});
      await new Promise(r=>setTimeout(r,140));
      await S.track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }catch(e){}
  }

  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      idle.textContent='카메라를 지원하지 않는 브라우저입니다';setState('카메라 불가',true);return;}
    try{
      let s0=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      const t0=s0.getVideoTracks()[0];
      const c0=t0.getCapabilities?t0.getCapabilities():{};
      const mw=c0.width&&c0.width.max?c0.width.max:1920, mh=c0.height&&c0.height.max?c0.height.max:1080;
      s0.getTracks().forEach(t=>t.stop());
      S.stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'},
               width:{ideal:Math.min(mw,3840)},height:{ideal:Math.min(mh,2160)},
               frameRate:{ideal:30},advanced:[{focusMode:'continuous'}]},audio:false});
      video.srcObject=S.stream;await video.play();
      S.track=S.stream.getVideoTracks()[0];
      const st=S.track.getSettings?S.track.getSettings():{};
      const cp=S.track.getCapabilities?S.track.getCapabilities():{};
      if(cp.zoom){try{await S.track.applyConstraints({advanced:[{zoom:cp.zoom.min}]});}catch(_){}}
      log('카메라 '+(st.width||'?')+'×'+(st.height||'?'));
      if(await loadZX())initZX();
      if('BarcodeDetector' in window){
        const sup=await window.BarcodeDetector.getSupportedFormats();
        const use=['code_128','code_39'].filter(f=>sup.includes(f));
        if(use.length){S.bd=new window.BarcodeDetector({formats:use});log('크롬 엔진 준비됨');}
      }
      if(!S.rdr&&!S.bd){idle.textContent='인식 엔진 없음';setState('엔진 없음',true);return;}
      idle.hidden=true;$('liveTag').hidden=false;$('btnFocus').disabled=false;
      setState('읽는 중');S.live=true;loop();
      setInterval(()=>{if(S.live&&S.sn.size===0)refocus();},3500);
    }catch(e){
      idle.textContent='카메라를 열 수 없습니다\n'+e.name;
      setState('카메라 실패: '+e.name,true);log('카메라 실패: '+e.name);
    }
  }

  $('stage').onclick=e=>{
    if(e.target.tagName==='INPUT')return;
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}
    refocus();
  };
  $('btnFocus').onclick=refocus;
  $('btnReset').onclick=()=>{
    S.sn.clear();S.cur=null;paintBoard();paintList();log('지웠습니다');
  };
  $('btnColors').onclick=async()=>{
    const rows=Object.keys(S.newColors).map(k=>k.slice(0,4)+'\t'+k.slice(4)+'\t'+S.newColors[k]);
    const txt=rows.length?('모델키\t색상코드\t색상명\n'+rows.join('\n')):'이번에 새로 등록한 색상이 없습니다';
    try{await navigator.clipboard.writeText(txt);log('색상표 복사됨 ('+rows.length+'건)');}
    catch(e){log('복사 실패');}
  };
  $('btnCopy').onclick=async()=>{
    try{await navigator.clipboard.writeText([...S.sn.keys()].join('\n')+'\n\n'+lines.join('\n'));
      log('복사했습니다');}catch(e){log('복사 실패');}
  };

  log('시작합니다');
  start();
})();
</script></body></html>
