<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라벨 인식 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E4DD; --card:#FBFAF7; --ink:#17181A; --ink-2:#5C5F63;
    --rule:#C8C4BA; --stamp:#0F6B3F; --alarm:#B3261E; --wait:#8A6A12;
    --steel:#1F2937; --r:3px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink)}
  body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:0 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px 32px}

  header{padding:12px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .state{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}
  .state.bad{color:var(--alarm)}

  .stage{position:relative;background:#000;border:2px solid var(--steel);
    border-radius:var(--r);overflow:hidden;aspect-ratio:16/9}
  video,canvas.preview{width:100%;height:100%;object-fit:cover;display:block}
  .band{position:absolute;left:3%;right:3%;top:50%;transform:translateY(-50%);
    height:44%;border:2px dashed rgba(255,255,255,.85);border-radius:2px;pointer-events:none}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{opacity:.75;transition:opacity .35s}
  .idle{position:absolute;inset:0;display:grid;place-items:center;color:#8b8f94;
    font-size:13px;padding:16px;text-align:center;white-space:pre-line}

  .shootrow{margin-top:8px}
  button,.filebtn{display:block;width:100%;font-family:'IBM Plex Sans KR',sans-serif;
    font-weight:600;border:2px solid var(--steel);border-radius:var(--r);
    background:var(--card);color:var(--ink);cursor:pointer;text-align:center}
  #btnShot{background:var(--stamp);border-color:var(--stamp);color:#fff;
    font-size:18px;padding:17px 10px;letter-spacing:.02em}
  #btnShot:active{background:#0A4D2D}
  .sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .sub button,.sub .filebtn{font-size:14px;padding:11px 8px}
  button:active,.filebtn:active{background:var(--steel);color:#fff}
  button:disabled{opacity:.4}
  button:focus-visible,.filebtn:focus-visible{outline:3px solid var(--wait);outline-offset:2px}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0}

  .verdict{margin-top:14px;border-radius:var(--r);padding:12px 14px;font-weight:600;
    border:2px solid var(--rule);background:var(--card);font-size:14.5px}
  .verdict.ok{border-color:var(--stamp);background:#EAF4EE;color:var(--stamp)}
  .verdict.part{border-color:var(--wait);background:#FFF6D9;color:#6B5210}
  .verdict.no{border-color:var(--alarm);background:#FBEBEA;color:var(--alarm)}
  .verdict small{display:block;font-weight:400;font-size:12.5px;margin-top:3px;color:var(--ink-2)}

  h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
    font-family:'IBM Plex Mono',monospace;margin:20px 0 7px;padding-bottom:5px;
    border-bottom:1px solid var(--rule)}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:10px 13px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--rule)}
  .row:last-child{border-bottom:0}
  .row dt{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
  .row dd{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:500;
    text-align:right;word-break:break-all}
  .row dd.miss{color:var(--ink-2);font-style:italic;font-weight:400}
  .row dd em{font-style:normal;background:#F4E9A8;padding:0 3px;border-radius:2px}

  .rec{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--stamp);
    border-radius:var(--r);margin-bottom:7px;padding:9px 12px}
  .rec.warn{border-left-color:var(--wait)}
  .rec.bad{border-left-color:var(--alarm)}
  .rec .kind{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-2)}
  .rec .val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;
    word-break:break-all;margin-top:1px}
  .rec .note{font-size:12px;color:var(--ink-2);margin-top:2px}
  .empty{border:1px dashed var(--rule);border-radius:var(--r);padding:16px;text-align:center;
    color:var(--ink-2);font-size:13px}

  .log{background:var(--steel);color:#D6D3CB;border-radius:var(--r);padding:9px 11px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.65;max-height:170px;
    overflow:auto;white-space:pre-wrap;word-break:break-all}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>라벨 인식 테스트</h1>
  <span class="state" id="state">준비 중…</span>
</header>

<div class="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas class="preview" id="still" hidden></canvas>
  <div class="band" id="band" hidden></div>
  <div class="flash" id="flash"></div>
  <div class="idle" id="idle">카메라 켜는 중…</div>
</div>

<div class="shootrow">
  <button id="btnShot" disabled>촬영해서 인식</button>
  <div class="sub">
    <label class="filebtn" for="file" tabindex="0" role="button">사진으로 시험</label>
    <input type="file" id="file" accept="image/*">
    <button id="btnReset">기록 지우기</button>
  </div>
</div>

<div class="verdict" id="verdict">촬영 버튼을 누르면 검사합니다.<small>라벨 전체가 화면 안에 들어오게 하고, 20cm 정도 떨어뜨리세요.</small></div>

<h2>라벨 요약</h2>
<div class="card">
  <dl>
    <div class="row"><dt>모델</dt><dd id="sModel" class="miss">미인식</dd></div>
    <div class="row"><dt>용량</dt><dd id="sCap" class="miss">미인식</dd></div>
    <div class="row"><dt>색상코드</dt><dd id="sColor" class="miss">미인식</dd></div>
    <div class="row"><dt>일련번호 뒤 7자리</dt><dd id="sSerial" class="miss">미인식</dd></div>
    <div class="row"><dt>IMEI</dt><dd id="sImei" class="miss">미인식</dd></div>
  </dl>
</div>

<h2>읽은 코드</h2>
<div id="results"><div class="empty">아직 없습니다</div></div>

<h2>기록</h2>
<div class="log" id="log">대기 중…</div>
<button id="btnCopy" style="margin-top:8px;font-size:14px;padding:11px 8px">기록 복사</button>

</div>

<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const video=$('video'), still=$('still'), idle=$('idle'), band=$('band'), flash=$('flash');
  const results=$('results'), logEl=$('log'), verdict=$('verdict');
  const S={ stream:null, track:null, imgcap:null, detector:null, items:new Map(), busy:false };

  const lines=[];
  function log(m){
    const t=new Date().toTimeString().slice(0,8);
    lines.push(t+'  '+m);
    logEl.textContent=lines.slice(-160).join('\n');
    logEl.scrollTop=logEl.scrollHeight;
  }
  function setState(t,bad){ const e=$('state'); e.textContent=t; e.className='state'+(bad?' bad':''); }

  const hasBD='BarcodeDetector' in window;

  /* 촬영음 */
  let actx=null;
  function shutter(){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      const t=actx.currentTime;
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='square'; o.frequency.setValueAtTime(1900,t);
      o.frequency.exponentialRampToValueAtTime(700,t+0.06);
      g.gain.setValueAtTime(0.22,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.1);
    }catch(_){ }
    flash.classList.add('on');
    setTimeout(()=>flash.classList.remove('on'),40);
  }

  /* 검증 */
  function luhn(s){
    if(!/^\d{15}$/.test(s)) return false;
    let sum=0;
    for(let i=0;i<15;i++){ let d=+s[14-i]; if(i%2===1){ d*=2; if(d>9)d-=9; } sum+=d; }
    return sum%10===0;
  }
  function classify(raw,fmt){
    const v=(raw||'').trim();
    if(/^\d{15}$/.test(v)){
      const ok=luhn(v);
      return {kind:'IMEI',value:v,level:ok?'ok':'bad',imei:ok?v:null,
              note:ok?'체크섬 통과':'체크섬 실패 — 잘못 읽혔을 수 있습니다'};
    }
    if(/^SM[A-Z0-9]{13}$/i.test(v)){
      const u=v.toUpperCase();
      return {kind:'일련번호 (S/N)',value:u,level:'ok',serial:u.slice(8),color:u[7],prefix:u.slice(0,7),
              note:'모델 '+u.slice(0,7)+' · 색상 '+u[7]+' · 일련 '+u.slice(8)};
    }
    if(/^\d{13}$/.test(v)) return {kind:'박스코드 (EAN-13)',value:v,level:'ok',note:'제품 SKU'};
    if(/^\d{7}$/.test(v))  return {kind:'일련번호 QR',value:v,level:'ok',serial:v,note:'뒤 7자리'};
    if(/^89\d{28,}$/.test(v)) return {kind:'EID',value:v,level:'warn',note:'eSIM 식별자 — 쓰지 않습니다'};
    return {kind:'기타 ('+(fmt||'?')+')',value:v,level:'warn',note:'분류되지 않은 코드'};
  }
  function add(raw,fmt){
    const k=(raw||'').trim().toUpperCase();
    if(!k||S.items.has(k)) return false;
    const r=classify(raw,fmt); S.items.set(k,r);
    log('읽음 ['+r.kind+'] '+r.value);
    return true;
  }

  function render(){
    const arr=[...S.items.values()];
    results.innerHTML = arr.length ? arr.map(r=>
      '<div class="rec '+(r.level==='ok'?'':r.level)+'"><div class="kind">'+r.kind+'</div>'+
      '<div class="val">'+r.value+'</div><div class="note">'+r.note+'</div></div>').join('')
      : '<div class="empty">아직 없습니다</div>';
    const sn=arr.find(r=>r.prefix), im=arr.find(r=>r.imei);
    if(sn){
      put('sSerial','<em>'+sn.serial+'</em>'); put('sColor',sn.color);
      if($('sModel').classList.contains('miss')) put('sModel',sn.prefix);
    }
    if(im) put('sImei',im.value);
  }
  function put(id,html){ const e=$(id); e.innerHTML=html; e.className=''; }

  /* 카메라 */
  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      idle.textContent='이 브라우저는 카메라를 지원하지 않습니다'; setState('카메라 불가',true); return;
    }
    try{
      S.stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},
               advanced:[{focusMode:'continuous'}]},audio:false});
      video.srcObject=S.stream; await video.play();
      S.track=S.stream.getVideoTracks()[0];
      const st=S.track.getSettings?S.track.getSettings():{};
      const caps=S.track.getCapabilities?S.track.getCapabilities():{};
      if(caps.zoom){ try{ await S.track.applyConstraints({advanced:[{zoom:caps.zoom.min}]}); }catch(_){} }
      if('ImageCapture' in window){ try{ S.imgcap=new window.ImageCapture(S.track); }catch(_){} }
      if(hasBD){
        const sup=await window.BarcodeDetector.getSupportedFormats();
        const use=['code_128','ean_13','qr_code','code_39','itf','data_matrix','ean_8'].filter(f=>sup.includes(f));
        S.detector=new window.BarcodeDetector({formats:use});
      }
      idle.hidden=true; band.hidden=false; $('btnShot').disabled=false;
      setState('준비됨 '+(st.width||'?')+'×'+(st.height||'?'));
      log('카메라 켜짐 '+(st.width||'?')+'×'+(st.height||'?')+(S.imgcap?' · 고해상도 촬영 가능':''));
      if(!hasBD){ setState('바코드 엔진 없음 — 크롬으로 열어주세요',true); }
    }catch(e){
      idle.textContent='카메라를 열 수 없습니다\n'+e.name;
      setState('카메라 실패: '+e.name,true);
      log('카메라 실패: '+e.name+' — '+e.message);
    }
  }

  /* ── 정확도 핵심: 한 장을 여러 방식으로 나눠 검사 ── */
  function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

  function crop(src,sx,sy,sw,sh,scale){
    const c=cv(Math.round(sw*scale),Math.round(sh*scale));
    const x=c.getContext('2d');
    x.imageSmoothingQuality='high';
    x.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
    return c;
  }
  function boost(c){
    const x=c.getContext('2d'), d=x.getImageData(0,0,c.width,c.height), p=d.data;
    let mn=255,mx=0;
    for(let i=0;i<p.length;i+=16){
      const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      if(g<mn)mn=g; if(g>mx)mx=g;
    }
    const rng=Math.max(1,mx-mn);
    for(let i=0;i<p.length;i+=4){
      let g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      g=Math.max(0,Math.min(255,(g-mn)*255/rng));
      p[i]=p[i+1]=p[i+2]=g;
    }
    x.putImageData(d,0,0); return c;
  }
  function rot90(src){
    const c=cv(src.height,src.width), x=c.getContext('2d');
    x.translate(c.width/2,c.height/2); x.rotate(Math.PI/2);
    x.drawImage(src,-src.width/2,-src.height/2); return c;
  }

  function* plan(img){
    const W=img.width, H=img.height;
    yield ['전체',()=>crop(img,0,0,W,H,Math.min(1,1600/Math.max(W,H)))];
    yield ['전체 원본',()=>crop(img,0,0,W,H,1)];
    const N=5, bh=Math.round(H/3.2), step=Math.round((H-bh)/(N-1));
    for(let i=0;i<N;i++){
      const y=i*step;
      yield ['띠'+(i+1),()=>crop(img,0,y,W,bh,1)];
      yield ['띠'+(i+1)+' 대비',()=>boost(crop(img,0,y,W,bh,1))];
    }
    yield ['가운데 확대',()=>crop(img,0,Math.round(H*0.3),W,Math.round(H*0.4),1.6)];
    yield ['가운데 대비',()=>boost(crop(img,0,Math.round(H*0.3),W,Math.round(H*0.4),1.6))];
    yield ['90도 회전',()=>rot90(crop(img,0,0,W,H,Math.min(1,1600/Math.max(W,H))))];
  }

  function done(){
    const a=[...S.items.values()];
    return a.some(r=>r.prefix) && a.some(r=>r.imei);
  }

  async function scan(img,tag){
    if(!S.detector){ log('바코드 엔진이 없어 검사할 수 없습니다'); return 0; }
    let n=0, tried=0;
    for(const [name,make] of plan(img)){
      tried++;
      let c; try{ c=make(); }catch(e){ continue; }
      try{
        const f=await S.detector.detect(c);
        if(f.length){
          let fresh=0;
          f.forEach(b=>{ if(add(b.rawValue,b.format)) fresh++; });
          if(fresh) log('  ↳ '+name+' 에서 '+fresh+'건');
          n+=fresh;
        }
      }catch(e){}
      if(done()) break;
      await new Promise(r=>setTimeout(r,0));
    }
    log(tag+' 검사 '+tried+'회 · 신규 '+n+'건');
    return n;
  }

  /* 글자 인식 */
  function loadScript(src){
    return new Promise((res,rej)=>{ const s=document.createElement('script');
      s.src=src; s.onload=res; s.onerror=()=>rej(new Error(src)); document.head.appendChild(s); });
  }
  async function ensureOcr(){
    if(window.Tesseract) return true;
    for(const u of ['https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js',
                    'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
                    'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js']){
      try{ await loadScript(u); if(window.Tesseract) return true; }catch(e){}
    }
    return false;
  }
  async function readText(img){
    if(!await ensureOcr()){ log('글자 인식 모듈을 불러오지 못했습니다'); return; }
    const sc=Math.min(1,1700/Math.max(img.width,img.height));
    const c=boost(crop(img,0,0,img.width,Math.round(img.height*0.6),sc));
    const {data}=await window.Tesseract.recognize(c,'eng');
    const raw=(data.text||'').replace(/\s+/g,' ').toUpperCase();
    log('글자: '+raw.slice(0,180));
    const cap=raw.match(/\(\s*(\d{2,4})\s*(GB|TB)\s*\)/);
    if(cap) put('sCap',cap[1]+cap[2]); else log('  ↳ 용량 표기 못 찾음');
    const md=raw.match(/SM-?[A-Z]\d{3}[A-Z0-9]{0,8}/);
    if(md) put('sModel',md[0].replace(/^SM(?!-)/,'SM-'));
  }

  /* 촬영 */
  async function capture(){
    if(S.busy) return; S.busy=true;
    const b=$('btnShot'); b.disabled=true; b.textContent='검사 중…';
    verdict.className='verdict'; verdict.innerHTML='검사하고 있습니다…<small>몇 초 걸립니다</small>';
    shutter();
    try{
      let img=null;
      if(S.imgcap){
        try{ const blob=await S.imgcap.takePhoto(); img=await createImageBitmap(blob);
             log('촬영 '+img.width+'×'+img.height); }
        catch(e){ log('고해상도 촬영 실패 — 화면 캡처로 대체'); }
      }
      if(!img){
        const c=cv(video.videoWidth,video.videoHeight);
        c.getContext('2d').drawImage(video,0,0); img=c;
        log('화면 캡처 '+c.width+'×'+c.height);
      }
      const prev=still.getContext('2d');
      still.width=img.width; still.height=img.height; prev.drawImage(img,0,0);
      await scan(img,'촬영본');
      render();
      await readText(img);
      render();
      const a=[...S.items.values()];
      const sn=a.find(r=>r.prefix), im=a.find(r=>r.imei);
      if(sn&&im){
        verdict.className='verdict ok';
        verdict.innerHTML='정상 인식<small>일련번호 '+sn.serial+' · IMEI '+im.value+'</small>';
      }else if(sn||im){
        verdict.className='verdict part';
        verdict.innerHTML='일부만 인식<small>'+(sn?'IMEI':'일련번호')+'를 못 읽었습니다. 라벨 전체가 화면에 들어오게 다시 찍어 보세요.</small>';
      }else{
        verdict.className='verdict no';
        verdict.innerHTML='인식 실패<small>라벨에서 20cm 정도 떨어뜨리고, 바코드가 화면 가로를 가득 채우게 해보세요.</small>';
      }
    }catch(e){ log('촬영 오류: '+e.message); }
    finally{ b.textContent='촬영해서 인식'; b.disabled=false; S.busy=false; }
  }

  $('btnShot').onclick=capture;
  $('file').onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const im=new Image();
    im.onload=async()=>{
      const c=cv(im.naturalWidth,im.naturalHeight);
      c.getContext('2d').drawImage(im,0,0);
      log('사진 '+c.width+'×'+c.height);
      await scan(c,'사진'); render(); await readText(c); render();
      URL.revokeObjectURL(im.src);
    };
    im.src=URL.createObjectURL(f);
  };
  $('btnReset').onclick=()=>{
    S.items.clear();
    [['sModel','미인식'],['sCap','미인식'],['sColor','미인식'],['sSerial','미인식'],['sImei','미인식']]
      .forEach(([id,t])=>{ const e=$(id); e.textContent=t; e.className='miss'; });
    verdict.className='verdict';
    verdict.innerHTML='촬영 버튼을 누르면 검사합니다.<small>라벨 전체가 화면 안에 들어오게 하고, 20cm 정도 떨어뜨리세요.</small>';
    render(); log('기록을 지웠습니다');
  };
  $('btnCopy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(lines.join('\n')); log('복사했습니다'); }
    catch(e){ log('복사 실패 — 길게 눌러 직접 선택하세요'); }
  };
  document.querySelector('.filebtn').addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('file').click(); }
  });

  log('시작합니다');
  start();
})();
</script></body></html>
