<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일련번호 스캔 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#E7E4DD;--card:#FBFAF7;--ink:#17181A;--ink-2:#5C5F63;--rule:#C8C4BA;
    --stamp:#0F6B3F;--alarm:#B3261E;--wait:#8A6A12;--steel:#1F2937;--r:3px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink)}
  body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:0 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px 32px}

  header{padding:12px 0 9px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .state{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}
  .state.bad{color:var(--alarm)}

  .stage{position:relative;background:#000;border:2px solid var(--steel);border-radius:var(--r);
    overflow:hidden;aspect-ratio:16/9;cursor:pointer}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .hit{position:absolute;inset:0;border:5px solid #3ED27B;opacity:0;pointer-events:none}
  .hit.on{opacity:1;transition:opacity .5s}
  .live{position:absolute;left:10px;top:9px;display:flex;align-items:center;gap:6px;
    color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;
    text-shadow:0 1px 3px #000;pointer-events:none}
  .live i{width:8px;height:8px;border-radius:50%;background:#FF3B30;animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .count{position:absolute;right:10px;bottom:9px;color:#fff;font-family:'IBM Plex Mono',monospace;
    font-size:13px;font-weight:600;text-shadow:0 1px 3px #000;pointer-events:none}
  .idle{position:absolute;inset:0;display:grid;place-items:center;color:#8b8f94;font-size:13px;
    padding:16px;text-align:center;white-space:pre-line}
  .tip{margin-top:6px;font-size:12px;color:var(--ink-2);text-align:center}

  .btns{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:9px}
  button{font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;border:2px solid var(--steel);
    border-radius:var(--r);background:var(--card);color:var(--ink);cursor:pointer;
    font-size:15px;padding:14px 8px}
  #btnFocus{background:var(--steel);color:#fff}
  button:active{background:var(--steel);color:#fff}
  button:disabled{opacity:.4}
  button:focus-visible{outline:3px solid var(--wait);outline-offset:2px}

  .last{margin-top:12px;border:2px solid var(--rule);border-radius:var(--r);
    background:var(--card);padding:12px 14px}
  .last.on{border-color:var(--stamp);background:#EAF4EE}
  .last .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-2)}
  .last .sn{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;
    letter-spacing:-.01em;word-break:break-all;margin-top:2px}
  .last .sn em{font-style:normal;background:#F4E9A8;padding:0 3px;border-radius:2px}
  .last .parts{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:13px;color:var(--ink-2)}
  .last .parts b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600}
  .last .none{color:var(--ink-2);font-size:14px}

  h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
    font-family:'IBM Plex Mono',monospace;margin:20px 0 7px;padding-bottom:5px;
    border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
  ol{list-style:none}
  ol li{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--stamp);
    border-radius:var(--r);margin-bottom:6px;padding:8px 11px;display:flex;
    justify-content:space-between;align-items:baseline;gap:10px}
  ol li .v{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;word-break:break-all}
  ol li .m{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
  .empty{border:1px dashed var(--rule);border-radius:var(--r);padding:16px;text-align:center;
    color:var(--ink-2);font-size:13px}

  .log{background:var(--steel);color:#D6D3CB;border-radius:var(--r);padding:9px 11px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.65;max-height:150px;
    overflow:auto;white-space:pre-wrap;word-break:break-all}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>일련번호 스캔</h1>
  <span class="state" id="state">준비 중…</span>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div class="hit" id="hit"></div>
  <div class="live" id="liveTag" hidden><i></i>읽는 중</div>
  <div class="count" id="count" hidden>0대</div>
  <div class="idle" id="idle">카메라 켜는 중…</div>
</div>
<div class="tip">바코드를 비추기만 하면 됩니다 · 흐리면 화면을 톡 누르세요</div>

<div class="btns">
  <button id="btnFocus" disabled>초점 다시 잡기</button>
  <button id="btnReset">지우기</button>
</div>

<div class="last" id="last">
  <div class="lbl">마지막 인식</div>
  <div class="none">아직 없습니다</div>
</div>

<h2><span>스캔 목록</span><span id="tot">0</span></h2>
<ol id="list"><li style="border-left-color:var(--rule);justify-content:center;color:var(--ink-2);font-size:13px">아직 없습니다</li></ol>

<h2>기록</h2>
<div class="log" id="log">대기 중…</div>
<button id="btnCopy" style="margin-top:8px;width:100%;font-size:14px;padding:11px 8px">기록 복사</button>

</div>

<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const video=$('video'),idle=$('idle'),hit=$('hit');
  const listEl=$('list'),logEl=$('log'),lastEl=$('last');
  const S={stream:null,track:null,det:null,live:false,busy:false,tick:0,items:new Map()};

  const lines=[];
  function log(m){
    const t=new Date().toTimeString().slice(0,8);
    lines.push(t+'  '+m);logEl.textContent=lines.slice(-140).join('\n');
    logEl.scrollTop=logEl.scrollHeight;
  }
  function setState(t,bad){const e=$('state');e.textContent=t;e.className='state'+(bad?' bad':'');}

  let actx=null;
  function beep(){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();
      const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
      o.type='square';o.frequency.setValueAtTime(2100,t);
      g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.1);
    }catch(_){}
    hit.classList.add('on');setTimeout(()=>hit.classList.remove('on'),260);
  }

  /* 삼성 S/N 만 취급 — IMEI·EID·EAN 은 무시 */
  function parse(raw){
    const v=(raw||'').trim().toUpperCase();
    if(!/^SM[A-Z0-9]{13}$/.test(v)) return null;
    return {sn:v,model:v.slice(0,7),color:v[7],serial:v.slice(8)};
  }

  function add(raw,fmt){
    const p=parse(raw);
    if(!p){ log('무시 ['+fmt+'] '+String(raw).slice(0,26)); return false; }
    if(S.items.has(p.sn)) return false;
    S.items.set(p.sn,p);
    log('인식 '+p.sn+'  (모델 '+p.model+' · 색상 '+p.color+' · 일련 '+p.serial+')');
    paintLast(p); paintList(); beep();
    return true;
  }

  function paintLast(p){
    lastEl.className='last on';
    lastEl.innerHTML='<div class="lbl">마지막 인식</div>'+
      '<div class="sn">'+p.model+p.color+'<em>'+p.serial+'</em></div>'+
      '<div class="parts"><span>모델 <b>'+p.model+'</b></span>'+
      '<span>색상 <b>'+p.color+'</b></span>'+
      '<span>일련 <b>'+p.serial+'</b></span></div>';
  }
  function paintList(){
    const a=[...S.items.values()].reverse();
    $('tot').textContent=a.length;
    $('count').textContent=a.length+'대';
    $('count').hidden=!a.length;
    listEl.innerHTML=a.length?a.map(p=>
      '<li><span class="v">'+p.serial+'</span><span class="m">'+p.model+p.color+'</span></li>').join('')
      :'<li style="border-left-color:var(--rule);justify-content:center;color:var(--ink-2);font-size:13px">아직 없습니다</li>';
  }

  function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
  function crop(src,sx,sy,sw,sh,scale){
    const c=cv(Math.round(sw*scale),Math.round(sh*scale)),x=c.getContext('2d');
    x.imageSmoothingQuality='high';x.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);return c;
  }
  function boost(c){
    const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data;
    let mn=255,mx=0;
    for(let i=0;i<p.length;i+=32){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      if(g<mn)mn=g;if(g>mx)mx=g;}
    const rg=Math.max(1,mx-mn);
    for(let i=0;i<p.length;i+=4){
      let g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      g=Math.max(0,Math.min(255,(g-mn)*255/rg));p[i]=p[i+1]=p[i+2]=g;}
    x.putImageData(d,0,0);return c;
  }

  /* 화면 전체를 계속 읽되, 회차마다 다른 방식으로 */
  async function loop(){
    if(!S.live)return;
    if(!S.busy&&S.det&&video.readyState>=2&&video.videoWidth){
      S.busy=true;
      try{
        const vw=video.videoWidth,vh=video.videoHeight;
        const m=S.tick%4; S.tick++;
        let target;
        if(m===0){ target=video; }
        else if(m===1){ target=boost(crop(video,0,0,vw,vh,1)); }
        else if(m===2){ target=crop(video,0,Math.round(vh*0.22),vw,Math.round(vh*0.56),1.3); }
        else { target=boost(crop(video,0,Math.round(vh*0.22),vw,Math.round(vh*0.56),1.3)); }
        const f=await S.det.detect(target);
        for(const b of f) add(b.rawValue,b.format);
      }catch(e){}
      S.busy=false;
    }
    setTimeout(()=>requestAnimationFrame(loop),55);
  }

  async function refocus(){
    if(!S.track)return;
    try{
      await S.track.applyConstraints({advanced:[{focusMode:'manual'}]});
      await new Promise(r=>setTimeout(r,150));
      await S.track.applyConstraints({advanced:[{focusMode:'continuous'}]});
      log('초점 재설정');
    }catch(e){ log('초점 제어 미지원 기기'); }
  }

  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      idle.textContent='카메라를 지원하지 않는 브라우저입니다';setState('카메라 불가',true);return;}
    if(!('BarcodeDetector' in window)){
      idle.textContent='바코드 엔진이 없습니다\n안드로이드 크롬으로 열어주세요';
      setState('바코드 엔진 없음',true);return;}
    try{
      S.stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440},
               frameRate:{ideal:30},advanced:[{focusMode:'continuous'}]},audio:false});
      video.srcObject=S.stream;await video.play();
      S.track=S.stream.getVideoTracks()[0];
      const st=S.track.getSettings?S.track.getSettings():{};
      const caps=S.track.getCapabilities?S.track.getCapabilities():{};
      if(caps.zoom){try{await S.track.applyConstraints({advanced:[{zoom:caps.zoom.min}]});}catch(_){}}
      const sup=await window.BarcodeDetector.getSupportedFormats();
      const use=['code_128','code_39','itf','qr_code','data_matrix'].filter(f=>sup.includes(f));
      S.det=new window.BarcodeDetector({formats:use});
      idle.hidden=true;$('liveTag').hidden=false;$('btnFocus').disabled=false;
      setState((st.width||'?')+'×'+(st.height||'?'));
      log('카메라 '+(st.width||'?')+'×'+(st.height||'?')+' · 형식 '+use.join(','));
      S.live=true;loop();
    }catch(e){
      idle.textContent='카메라를 열 수 없습니다\n'+e.name;
      setState('카메라 실패: '+e.name,true);log('카메라 실패: '+e.name+' — '+e.message);
    }
  }

  $('stage').onclick=()=>{ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}} refocus(); };
  $('btnFocus').onclick=refocus;
  $('btnReset').onclick=()=>{
    S.items.clear();paintList();
    lastEl.className='last';
    lastEl.innerHTML='<div class="lbl">마지막 인식</div><div class="none">아직 없습니다</div>';
    log('목록을 지웠습니다');
  };
  $('btnCopy').onclick=async()=>{
    const sn=[...S.items.values()].map(p=>p.sn).join('\n');
    const txt=(sn?('스캔 '+S.items.size+'건\n'+sn+'\n\n'):'')+lines.join('\n');
    try{await navigator.clipboard.writeText(txt);log('복사했습니다');}
    catch(e){log('복사 실패 — 길게 눌러 선택하세요');}
  };

  log('시작합니다');
  start();
})();
</script></body></html>
