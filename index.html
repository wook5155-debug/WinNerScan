<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일련번호 스캔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#E7E4DD;--card:#FBFAF7;--ink:#17181A;--ink-2:#5C5F63;--rule:#C8C4BA;
    --stamp:#0F6B3F;--alarm:#B3261E;--wait:#8A6A12;--steel:#1F2937;--r:3px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink)}
  body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:0 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px 30px}
  header{padding:11px 0 8px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .state{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2)}
  .state.bad{color:var(--alarm)}
  .eng{display:flex;gap:6px;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;font-size:10.5px}
  .eng span{border:1px solid var(--rule);border-radius:var(--r);padding:2px 7px;background:var(--card);color:var(--ink-2)}
  .eng span.on{border-color:var(--stamp);color:var(--stamp)}
  .stage{position:relative;background:#000;border:2px solid var(--steel);border-radius:var(--r);
    overflow:hidden;aspect-ratio:16/9;cursor:pointer}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .hit{position:absolute;inset:0;border:5px solid #3ED27B;opacity:0;pointer-events:none}
  .hit.on{opacity:1;transition:opacity .5s}
  .live{position:absolute;left:9px;top:8px;display:flex;align-items:center;gap:6px;color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-shadow:0 1px 3px #000;pointer-events:none}
  .live i{width:7px;height:7px;border-radius:50%;background:#FF3B30;animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .idle{position:absolute;inset:0;display:grid;place-items:center;color:#8b8f94;font-size:13px;
    padding:16px;text-align:center;white-space:pre-line}
  .tip{margin-top:6px;font-size:12px;color:var(--ink-2);text-align:center}
  .btns{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:9px}
  button{font-family:'IBM Plex Sans KR',sans-serif;font-weight:600;border:2px solid var(--steel);
    border-radius:var(--r);background:var(--card);color:var(--ink);cursor:pointer;font-size:15px;padding:13px 8px}
  #btnFocus{background:var(--steel);color:#fff}
  button:active{background:var(--steel);color:#fff}
  button:disabled{opacity:.4}
  .last{margin-top:11px;border:2px solid var(--rule);border-radius:var(--r);background:var(--card);padding:11px 13px}
  .last.on{border-color:var(--stamp);background:#EAF4EE}
  .last .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-2)}
  .last .sn{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;
    word-break:break-all;margin-top:2px}
  .last .sn em{font-style:normal;background:#F4E9A8;padding:0 3px;border-radius:2px}
  .last .parts{display:flex;gap:13px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-2)}
  .last .parts b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600}
  .last .none{color:var(--ink-2);font-size:14px}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
    font-family:'IBM Plex Mono',monospace;margin:18px 0 6px;padding-bottom:5px;
    border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
  .raw{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--steel);
    border-radius:var(--r);margin-bottom:6px;padding:8px 11px}
  .raw.sn{border-left-color:var(--stamp)}
  .raw .h{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .raw .v{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600;
    word-break:break-all;margin-top:2px}
  .empty{border:1px dashed var(--rule);border-radius:var(--r);padding:16px;text-align:center;
    color:var(--ink-2);font-size:13px}
  .log{background:var(--steel);color:#D6D3CB;border-radius:var(--r);padding:9px 11px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;max-height:150px;
    overflow:auto;white-space:pre-wrap;word-break:break-all}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>일련번호 스캔</h1>
  <span class="state" id="state">준비 중…</span>
</header>
<div class="eng">
  <span id="e1">크롬 엔진</span>
  <span id="e2">ZXing 엔진</span>
  <span id="e3">해상도 —</span>
</div>

<div class="stage" id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div class="hit" id="hit"></div>
  <div class="live" id="liveTag" hidden><i></i>읽는 중</div>
  <div class="idle" id="idle">카메라 켜는 중…</div>
</div>
<div class="tip">바코드가 화면 가로를 가득 채우게 · 흐리면 화면을 톡 누르세요</div>

<div class="btns">
  <button id="btnFocus" disabled>초점 다시 잡기</button>
  <button id="btnReset">지우기</button>
</div>

<div class="last" id="last">
  <div class="lbl">마지막 인식</div>
  <div class="none">아직 없습니다</div>
</div>

<h2><span>읽힌 값 (거르지 않음)</span><span id="tot">0</span></h2>
<div id="list"><div class="empty">아직 아무것도 못 읽었습니다</div></div>

<h2>기록</h2>
<div class="log" id="log">대기 중…</div>
<button id="btnCopy" style="margin-top:8px;width:100%;font-size:14px;padding:11px 8px">전부 복사</button>

</div>

<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const video=$('video'),idle=$('idle'),hit=$('hit'),listEl=$('list'),logEl=$('log'),lastEl=$('last');
  const S={stream:null,track:null,bd:null,zx:null,zxReader:null,live:false,busy:false,tick:0,items:new Map()};

  const lines=[];
  function log(m){
    const t=new Date().toTimeString().slice(0,8);
    lines.push(t+'  '+m);logEl.textContent=lines.slice(-140).join('\n');
    logEl.scrollTop=logEl.scrollHeight;
  }
  function setState(t,bad){const e=$('state');e.textContent=t;e.className='state'+(bad?' bad':'');}

  let actx=null;
  function beep(){
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();
      const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
      o.type='square';o.frequency.setValueAtTime(2100,t);
      g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.1);
    }catch(_){}
    hit.classList.add('on');setTimeout(()=>hit.classList.remove('on'),260);
  }

  function findSN(v){const m=String(v).toUpperCase().match(/SM[A-Z0-9]{13}/);return m?m[0]:null;}
  function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  function add(raw,fmt,eng){
    const v=String(raw||'').trim();
    if(!v||S.items.has(v))return false;
    const sn=findSN(v);
    S.items.set(v,{v,fmt,eng,sn});
    log('읽음 ['+eng+'/'+fmt+'/'+v.length+'자] '+v);
    if(sn)paintLast(sn);
    paint();beep();
    return true;
  }
  function paintLast(sn){
    lastEl.className='last on';
    lastEl.innerHTML='<div class="lbl">마지막 인식</div>'+
      '<div class="sn">'+sn.slice(0,8)+'<em>'+sn.slice(8)+'</em></div>'+
      '<div class="parts"><span>모델 <b>'+sn.slice(0,7)+'</b></span>'+
      '<span>색상 <b>'+sn[7]+'</b></span><span>일련 <b>'+sn.slice(8)+'</b></span></div>';
  }
  function paint(){
    const a=[...S.items.values()].reverse();
    $('tot').textContent=a.length;
    listEl.innerHTML=a.length?a.map(r=>
      '<div class="raw'+(r.sn?' sn':'')+'"><div class="h"><span>'+esc(r.eng)+' · '+esc(r.fmt)+
      '</span><span>'+r.v.length+'자</span></div><div class="v">'+esc(r.v)+'</div></div>').join('')
      :'<div class="empty">아직 아무것도 못 읽었습니다</div>';
  }

  function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
  function crop(src,sx,sy,sw,sh,scale){
    const c=cv(Math.round(sw*scale),Math.round(sh*scale)),x=c.getContext('2d',{willReadFrequently:true});
    x.imageSmoothingQuality='high';x.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);return c;
  }
  function boost(c){
    const x=c.getContext('2d',{willReadFrequently:true}),d=x.getImageData(0,0,c.width,c.height),p=d.data;
    let mn=255,mx=0;
    for(let i=0;i<p.length;i+=32){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      if(g<mn)mn=g;if(g>mx)mx=g;}
    const rg=Math.max(1,mx-mn);
    for(let i=0;i<p.length;i+=4){
      let g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;
      g=Math.max(0,Math.min(255,(g-mn)*255/rg));p[i]=p[i+1]=p[i+2]=g;}
    x.putImageData(d,0,0);return c;
  }

  /* ZXing 로드 */
  function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');
    s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s);});}
  async function loadZX(){
    for(const u of ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
                    'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',
                    'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js']){
      try{ await loadScript(u); if(window.ZXing) return true; }catch(e){}
    }
    return false;
  }
  function initZX(){
    try{
      const Z=window.ZXing;
      const hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,
        [Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.CODABAR]);
      hints.set(Z.DecodeHintType.TRY_HARDER,true);
      const r=new Z.MultiFormatReader();
      r.setHints(hints);
      S.zxReader=r;S.zx=Z;
      $('e2').classList.add('on');
      log('ZXing 엔진 준비됨');
      return true;
    }catch(e){ log('ZXing 초기화 실패: '+e.message); return false; }
  }
  function zxDecode(canvas){
    if(!S.zxReader)return null;
    try{
      const Z=S.zx;
      const src=new Z.HTMLCanvasElementLuminanceSource(canvas);
      const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(src));
      const res=S.zxReader.decode(bmp);
      return res?{text:res.getText(),fmt:String(res.getBarcodeFormat())}:null;
    }catch(e){ return null; }
    finally{ try{S.zxReader.reset();}catch(_){} }
  }

  async function loop(){
    if(!S.live)return;
    if(!S.busy&&video.readyState>=2&&video.videoWidth){
      S.busy=true;
      try{
        const vw=video.videoWidth,vh=video.videoHeight;
        const m=S.tick%4;S.tick++;
        let c;
        if(m===0)c=crop(video,0,0,vw,vh,1);
        else if(m===1)c=boost(crop(video,0,0,vw,vh,1));
        else if(m===2)c=crop(video,0,Math.round(vh*0.20),vw,Math.round(vh*0.60),1);
        else c=boost(crop(video,0,Math.round(vh*0.20),vw,Math.round(vh*0.60),1));

        if(S.bd){
          try{ const f=await S.bd.detect(c);
            for(const b of f) add(b.rawValue,b.format,'크롬'); }catch(e){}
        }
        const z=zxDecode(c);
        if(z) add(z.text,z.fmt,'ZXing');
      }catch(e){}
      S.busy=false;
    }
    setTimeout(()=>requestAnimationFrame(loop),50);
  }

  async function refocus(){
    if(!S.track)return;
    try{
      await S.track.applyConstraints({advanced:[{focusMode:'manual'}]});
      await new Promise(r=>setTimeout(r,140));
      await S.track.applyConstraints({advanced:[{focusMode:'continuous'}]});
      log('초점 재설정');
    }catch(e){ log('초점 제어 미지원 기기'); }
  }

  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      idle.textContent='카메라를 지원하지 않는 브라우저입니다';setState('카메라 불가',true);return;}
    try{
      /* 1차: 기본으로 열어 능력치 확인 */
      let st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      let tr=st.getVideoTracks()[0];
      const caps=tr.getCapabilities?tr.getCapabilities():{};
      const maxW=caps.width&&caps.width.max?caps.width.max:1920;
      const maxH=caps.height&&caps.height.max?caps.height.max:1080;
      log('카메라 최대 '+maxW+'×'+maxH);
      st.getTracks().forEach(t=>t.stop());

      /* 2차: 최대 해상도로 다시 열기 */
      S.stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'},
               width:{ideal:Math.min(maxW,3840)},height:{ideal:Math.min(maxH,2160)},
               frameRate:{ideal:30},advanced:[{focusMode:'continuous'}]},audio:false});
      video.srcObject=S.stream;await video.play();
      S.track=S.stream.getVideoTracks()[0];
      const s2=S.track.getSettings?S.track.getSettings():{};
      const c2=S.track.getCapabilities?S.track.getCapabilities():{};
      if(c2.zoom){try{await S.track.applyConstraints({advanced:[{zoom:c2.zoom.min}]});}catch(_){}}
      $('e3').textContent=(s2.width||'?')+'×'+(s2.height||'?');
      $('e3').classList.add('on');
      setState('읽는 중');
      log('실제 '+(s2.width||'?')+'×'+(s2.height||'?'));

      if('BarcodeDetector' in window){
        const sup=await window.BarcodeDetector.getSupportedFormats();
        S.bd=new window.BarcodeDetector({formats:sup});
        $('e1').classList.add('on');
        log('크롬 엔진 준비됨 ('+sup.length+'종)');
      }else log('크롬 바코드 엔진 없음');

      if(await loadZX()) initZX(); else log('ZXing 내려받기 실패 — 인터넷 확인');

      if(!S.bd&&!S.zxReader){
        idle.textContent='인식 엔진을 하나도 못 씁니다';setState('엔진 없음',true);return;}

      idle.hidden=true;$('liveTag').hidden=false;$('btnFocus').disabled=false;
      S.live=true;loop();
      setInterval(()=>{ if(S.live&&S.items.size===0) refocus(); },4000);
    }catch(e){
      idle.textContent='카메라를 열 수 없습니다\n'+e.name;
      setState('카메라 실패: '+e.name,true);log('카메라 실패: '+e.name+' — '+e.message);
    }
  }

  $('stage').onclick=()=>{if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}refocus();};
  $('btnFocus').onclick=refocus;
  $('btnReset').onclick=()=>{
    S.items.clear();paint();
    lastEl.className='last';
    lastEl.innerHTML='<div class="lbl">마지막 인식</div><div class="none">아직 없습니다</div>';
    log('지웠습니다');
  };
  $('btnCopy').onclick=async()=>{
    const vals=[...S.items.values()].map(r=>'['+r.eng+' '+r.fmt+' '+r.v.length+'자] '+r.v).join('\n');
    const txt=(vals?('읽힌 값\n'+vals+'\n\n'):'')+lines.join('\n');
    try{await navigator.clipboard.writeText(txt);log('복사했습니다');}
    catch(e){log('복사 실패 — 길게 눌러 선택하세요');}
  };

  log('시작합니다');
  start();
})();
</script></body></html>
